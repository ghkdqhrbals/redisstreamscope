name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/web
          retention-days: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -count=1 ./...

  redis-compatibility:
    name: Redis ${{ matrix.redis }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        redis:
          - "6.2"
          - "7.0"
          - "7.2"
          - "7.4"
          - "8.0"
          - "8.2"
          - "8.4"
          - "8.6"
          - "8.8"
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download web build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist/web

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Redis Streams compatibility suite
        env:
          REDIS_TEST_ADDR: 127.0.0.1:6379
          REDIS_TEST_VERSION: ${{ matrix.redis }}
        run: go test -v -count=1 -run '^TestRedisVersionCompatibility$' .
