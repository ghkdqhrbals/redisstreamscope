name: Release container image

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: streamscope-release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.bump }} version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the main branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [[ "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "Container releases must be requested from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | grep -m1 -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -n "$latest_tag" ]]; then
            current_version=${latest_tag#v}
          else
            current_version=$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json','utf8')).version)")
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "$BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported version component: $BUMP"
              exit 1
              ;;
          esac

          version="$major.$minor.$patch"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "Git tag v$version already exists."
            exit 1
          fi

          image=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          {
            echo "current=$current_version"
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.major }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=StreamScope
            org.opencontainers.image.description=Redis Streams operations console
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "StreamScope v$VERSION" --generate-notes

      - name: Write release summary
        env:
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          {
            echo "## StreamScope container release"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Previous version | $CURRENT_VERSION |"
            echo "| Released version | $VERSION |"
            echo "| Container image | $IMAGE:$VERSION |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
