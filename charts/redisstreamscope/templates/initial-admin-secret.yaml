{{- if not .Values.initialAdmin.existingSecret }}
{{- $secretName := include "redisstreamscope.initialAdminSecretName" . }}
{{- $password := randAlphaNum 32 }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.initialAdmin.passwordKey) }}
{{- $password = index $existing.data .Values.initialAdmin.passwordKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  labels:
    {{- include "redisstreamscope.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.initialAdmin.passwordKey | quote }}: {{ $password | b64enc | quote }}
{{- end }}
