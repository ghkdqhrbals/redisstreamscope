# StreamScope configuration template.
# The application starts normally while every property remains commented.
# The setup wizard replaces this file with active properties.
# REDIS_* startup environment variables are also written to this file.
#
# Schema version. Default written by the wizard: 1.
# version=1
#
# Send the session cookie only over HTTPS. Default: false.
# server.secureCookies=false
#
# Login session lifetime. Default: 12h.
# Go duration syntax: 30m, 12h, 24h.
# server.sessionTTL=12h
#
# Number of Redis connections. Default: 0.
# redis.connections=1
#
# Connection 0 ID. Required. No default.
# redis.0.id=production
#
# UI display name. Default: connection ID.
# redis.0.name=Production Redis
#
# Connection mode. Default: standalone.
# Allowed: standalone, sentinel, cluster.
# redis.0.mode=standalone
#
# Comma-separated Redis URLs or node addresses. Required. No default.
# redis.0.addresses=redis://redis.internal:6379/0
#
# Sentinel master name. Default: empty.
# Required only in sentinel mode.
# redis.0.masterName=
#
# Redis ACL username. Default: empty, which uses the Redis default user.
# redis.0.username=
#
# Direct Redis password. Default: empty, meaning no password.
# Use only one of password, passwordEnv, or passwordFile.
# redis.0.password=
#
# Environment variable containing the Redis password. Default: empty.
# redis.0.passwordEnv=
#
# Container file containing the Redis password. Default: empty.
# redis.0.passwordFile=
#
# Redis database number. Default: 0. Cluster mode must use 0.
# redis.0.database=0
#
# Stream discovery pattern. Default: *.
# redis.0.keyPattern=*
#
# Enable Redis TLS. Default: false. A rediss:// URL also enables TLS.
# redis.0.tls=false
#
# TLS certificate server name. Default: empty.
# redis.0.tlsServerName=
#
# Private CA file path. Default: empty, which uses the system trust store.
# redis.0.tlsCAFile=
#
# mTLS client certificate path. Default: empty.
# Certificate and key must be configured together.
# redis.0.tlsCertFile=
#
# mTLS client private key path. Default: empty.
# redis.0.tlsKeyFile=
#
# Add another connection by increasing redis.connections and using redis.1.*,
# redis.2.*, and so on. The same defaults apply to every connection index.
